name: SUNO Tracker

on:
  schedule:
    - cron: '0 * * * *'  # 毎時（新曲なければ3時間おきにスキップ）
  workflow_dispatch:  # 手動実行

permissions:
  contents: write
  actions: read

# 同じワークフローを重ねて走らせない（失敗通知の重複を防ぐ）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Setup config
        run: |
          cp config.example.json config.json
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config.json', 'utf-8'));
            c.notification.discordWebhookUrl = process.env.DISCORD_WEBHOOK_URL || '';
            c.notification.enabled = !!process.env.DISCORD_WEBHOOK_URL;
            fs.writeFileSync('config.json', JSON.stringify(c, null, 2));
          "
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Fix CSV headers if needed
        run: |
          CORRECT_HEADER="timestamp,artist,songId,title,url,plays,likes,comments,imageUrl,createdAt"
          for f in data/*.csv; do
            [ ! -f "$f" ] && continue
            # followers.csv と trends.csv と hooks.csv はスキップ
            case "$f" in *followers.csv|*trends.csv|*hooks.csv) continue;; esac
            CURRENT=$(head -1 "$f")
            if [ "$CURRENT" != "$CORRECT_HEADER" ]; then
              echo "Fixing header: $f"
              sed -i "1s/.*/$CORRECT_HEADER/" "$f"
            fi
          done

      - name: Run tracker
        env:
          # 新曲検知時に vocal-srt-generator へ repository_dispatch するためのトークン。
          # 未設定なら srt-dispatcher が安全にスキップする（既存の毎時実行は壊れない）。
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: node src/index.js

      # 本体が途中で落ちても日報の送信記録（daily-report-state.json）を残し、翌時間の二重送信を防ぐ
      - name: Commit and push data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # 通知は「このステップまで来た通常の実行」が対象。再実行（re-run）・強制キャンセル・ランナー停止は取りこぼすことがある
      - name: Notify Discord on failure / recovery
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOW: ${{ job.status }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "no webhook, skip"; exit 0; }
          PREV=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" --branch main --status completed -L 10 \
            --json databaseId,conclusion -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].conclusion // \"\"")
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MSG=""
          if [ "$NOW" != "success" ] && [ "$PREV" = "success" ]; then
            MSG="⚠️ SUNO Tracker（再生数・フォロワー収集） が失敗しました（$NOW）。データが取れていません。ログ: $URL"
          elif [ "$NOW" = "success" ] && [ -n "$PREV" ] && [ "$PREV" != "success" ]; then
            MSG="✅ SUNO Tracker（再生数・フォロワー収集） が復旧しました。ログ: $URL"
          fi
          echo "prev=$PREV now=$NOW"
          [ -z "$MSG" ] && exit 0
          jq -n --arg c "$MSG" '{content:$c}' | curl -sS -f --connect-timeout 10 --max-time 20 -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
